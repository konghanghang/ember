version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: ember-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ember
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database:/docker-entrypoint-initdb.d
    networks:
      - ember-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Go API 服务
  ember-api:
    # 使用预构建的镜像（生产环境推荐）
    image: ghcr.io/konghanghang/ember-api:latest

    # 如需本地构建，取消下面两行注释并注释上面的 image 行
    # build:
    #   context: ../../services/api
    #   dockerfile: Dockerfile

    container_name: ember-api
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CONFIG_ENCRYPTION_KEY=${CONFIG_ENCRYPTION_KEY}
      - AUTO_MIGRATE=${AUTO_MIGRATE:-true}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - EMBY_WEBHOOK_TOKEN=${EMBY_WEBHOOK_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ember-network
    restart: unless-stopped
    volumes:
      - api_logs:/app/logs
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Vue 前端服务
  ember-web:
    # 使用预构建的镜像（生产环境推荐）
    image: ghcr.io/konghanghang/ember-web:latest

    # 如需本地构建，取消下面两行注释并注释上面的 image 行
    # build:
    #   context: ../../services/web
    #   dockerfile: Dockerfile

    container_name: ember-web
    ports:
      - "80:80"
    networks:
      - ember-network
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Python Telegram Bot
  ember-bot:
    # 使用预构建的镜像（生产环境推荐）
    image: ghcr.io/konghanghang/ember-bot:latest

    # 如需本地构建，取消下面两行注释并注释上面的 image 行
    # build:
    #   context: ../../services/bot
    #   dockerfile: Dockerfile

    container_name: ember-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_UPDATE_MODE=${TELEGRAM_UPDATE_MODE:-webhook}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - TELEGRAM_GROUP_CHAT_ID=${TELEGRAM_GROUP_CHAT_ID}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - API_URL=http://ember-api:8080
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - BOT_PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      - ember-api
    networks:
      - ember-network
    restart: unless-stopped
    volumes:
      - bot_logs:/app/logs
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx 反向代理（可选）
  # nginx:
  #   image: nginx:alpine
  #   container_name: ember-nginx
  #   ports:
  #     - "443:443"
  #   volumes:
  #     - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ../nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - ember-api
  #     - ember-web
  #   networks:
  #     - ember-network
  #   restart: unless-stopped

networks:
  ember-network:
    driver: bridge

volumes:
  postgres_data:
  api_logs:
  bot_logs:

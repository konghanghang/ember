services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: ember-postgres
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 必须显式提供（本地可在 .env 中配置）}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须显式提供，禁止使用默认值}
      POSTGRES_DB: ${POSTGRES_DB:-ember}
    ports:
      # 仅本机回环可达；远程访问请走 SSH tunnel 或在反代层授权
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 不再挂载 PG initdb.d：schema 初始化与升级统一由 ember-api 启动期 Migrate
      # 阶段从空库一次性应用 infrastructure/database/ 顶层 SQL（新空库分支）
    networks:
      - ember-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  # Go API 服务
  ember-api:
    # 默认 tag 随每次发版同步更新（见 docs/runbooks/release-process.md 的发版 checklist）；
    # 生产环境建议在 .env 中显式覆盖以避免依赖默认值漂移。
    image: ${EMBER_API_IMAGE:-ghcr.io/konghanghang/ember-api:v1.6.4}

    # 如需本地构建，保留上面的 image 行作为本地 Tag，并取消下面三行注释；
    # ember-gateway 会直接复用构建后的同一镜像。
    # build:
    #   context: ../../
    #   dockerfile: services/api/Dockerfile

    container_name: ember-api
    environment:
      - PORT=8080
      # DATABASE_URL 缺省时由 compose 按 POSTGRES_USER/PASSWORD/DB 自动拼接到内置 postgres；
      # 外部覆盖（指向独立 DB）时仍取外部值
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ember}?sslmode=disable}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 必须显式提供（≥32 字符）}
      - CONFIG_ENCRYPTION_KEY=${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY 必须显式提供}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET 必须显式提供（API ↔ Bot 共享密钥）}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - EMBY_WEBHOOK_TOKEN=${EMBY_WEBHOOK_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - WEBHOOK_URL=${WEBHOOK_URL}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ember-network
    restart: unless-stopped
    volumes:
      - api_logs:/app/logs
    healthcheck:
      # 与 Dockerfile HEALTHCHECK 行为对齐，但显式声明便于 review；
      # 镜像层若调整 HEALTHCHECK 时本字段是单一来源
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    stop_grace_period: 30s

  # Emby 兼容播放网关：与 API 复用同一镜像，只切换进程子命令
  ember-gateway:
    profiles: ["gateway"]
    image: ${EMBER_API_IMAGE:-ghcr.io/konghanghang/ember-api:v1.6.4}
    container_name: ember-gateway
    command: ["gateway"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ember}?sslmode=disable}
      - CONFIG_ENCRYPTION_KEY=${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY 必须显式提供}
    ports:
      # 只允许宿主机反向代理访问；禁止直接把 Gateway HTTP 端口暴露公网
      - "127.0.0.1:${PLAYBACK_GATEWAY_PORT:-8081}:8081"
    depends_on:
      ember-api:
        condition: service_healthy
    networks:
      - ember-network
    restart: unless-stopped
    volumes:
      - gateway_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    init: true
    stop_grace_period: 30s

  # Vue 前端服务
  ember-web:
    # 默认 tag 随每次发版同步更新（见 docs/runbooks/release-process.md 的发版 checklist）；
    # 生产环境建议在 .env 中显式覆盖以避免依赖默认值漂移。
    image: ${EMBER_WEB_IMAGE:-ghcr.io/konghanghang/ember-web:v1.6.4}

    # 如需本地构建，取消下面两行注释并注释上面的 image 行
    # build:
    #   context: ../../services/web
    #   dockerfile: Dockerfile

    container_name: ember-web
    ports:
      - "80:80"
    networks:
      - ember-network
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Python Telegram Bot（默认不启动；启用时使用 docker compose --profile bot up -d）
  ember-bot:
    profiles: ["bot"]
    # 默认 tag 随每次发版同步更新（见 docs/runbooks/release-process.md 的发版 checklist）；
    # 生产环境建议在 .env 中显式覆盖以避免依赖默认值漂移。
    image: ${EMBER_BOT_IMAGE:-ghcr.io/konghanghang/ember-bot:v1.6.4}

    # 如需本地构建，取消下面两行注释并注释上面的 image 行
    # build:
    #   context: ../../services/bot
    #   dockerfile: Dockerfile

    container_name: ember-bot
    environment:
      # Bot 相关 secret 由 Bot 进程内自验，compose 解析期不强制
      # （强制会让仅启动 postgres + ember-api 的部署也被拒绝）
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_UPDATE_MODE=${TELEGRAM_UPDATE_MODE:-webhook}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - TELEGRAM_GROUP_CHAT_ID=${TELEGRAM_GROUP_CHAT_ID}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - API_URL=http://ember-api:8080
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - BOT_PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      ember-api:
        condition: service_healthy
    networks:
      - ember-network
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    volumes:
      - bot_logs:/app/logs
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx 反向代理（可选）
  # nginx:
  #   image: nginx:alpine
  #   container_name: ember-nginx
  #   ports:
  #     - "443:443"
  #   volumes:
  #     - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ../nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - ember-api
  #     - ember-web
  #   networks:
  #     - ember-network
  #   restart: unless-stopped

networks:
  ember-network:
    driver: bridge

volumes:
  postgres_data:
  api_logs:
  gateway_logs:
  bot_logs:

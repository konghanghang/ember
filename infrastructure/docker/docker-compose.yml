services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: ember-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 必须显式提供（本地可在 .env 中配置）}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须显式提供，禁止使用默认值}
      POSTGRES_DB: ${POSTGRES_DB:-ember}
    ports:
      # 仅本机回环可达；远程访问请走 SSH tunnel 或在反代层授权
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 仅挂载首启执行的 SQL 子目录，禁止把整个 ../database 目录暴露给 PG initdb.d
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - ember-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Go API 服务
  ember-api:
    # 使用预构建的镜像（生产环境推荐）
    image: ghcr.io/konghanghang/ember-api:latest

    # 如需本地构建，取消下面两行注释并注释上面的 image 行
    # build:
    #   context: ../../services/api
    #   dockerfile: Dockerfile

    container_name: ember-api
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL 必须显式提供}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 必须显式提供（≥32 字符）}
      - CONFIG_ENCRYPTION_KEY=${CONFIG_ENCRYPTION_KEY:?CONFIG_ENCRYPTION_KEY 必须显式提供}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:?INTERNAL_API_SECRET 必须显式提供（API ↔ Bot 共享密钥）}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - EMBY_WEBHOOK_TOKEN=${EMBY_WEBHOOK_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - WEBHOOK_URL=${WEBHOOK_URL}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ember-network
    restart: unless-stopped
    volumes:
      - api_logs:/app/logs
    healthcheck:
      # 与 Dockerfile HEALTHCHECK 行为对齐，但显式声明便于 review；
      # 镜像层若调整 HEALTHCHECK 时本字段是单一来源
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Vue 前端服务
  ember-web:
    # 使用预构建的镜像（生产环境推荐）
    image: ghcr.io/konghanghang/ember-web:latest

    # 如需本地构建，取消下面两行注释并注释上面的 image 行
    # build:
    #   context: ../../services/web
    #   dockerfile: Dockerfile

    container_name: ember-web
    ports:
      - "80:80"
    networks:
      - ember-network
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Python Telegram Bot
  ember-bot:
    # 使用预构建的镜像（生产环境推荐）
    image: ghcr.io/konghanghang/ember-bot:latest

    # 如需本地构建，取消下面两行注释并注释上面的 image 行
    # build:
    #   context: ../../services/bot
    #   dockerfile: Dockerfile

    container_name: ember-bot
    environment:
      # Bot 相关 secret 由 Bot 进程内自验，compose 解析期不强制
      # （强制会让仅启动 postgres + ember-api 的部署也被拒绝）
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_UPDATE_MODE=${TELEGRAM_UPDATE_MODE:-webhook}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - TELEGRAM_GROUP_CHAT_ID=${TELEGRAM_GROUP_CHAT_ID}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - API_URL=http://ember-api:8080
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - BOT_PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      ember-api:
        condition: service_healthy
    networks:
      - ember-network
    restart: unless-stopped
    volumes:
      - bot_logs:/app/logs
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx 反向代理（可选）
  # nginx:
  #   image: nginx:alpine
  #   container_name: ember-nginx
  #   ports:
  #     - "443:443"
  #   volumes:
  #     - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ../nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - ember-api
  #     - ember-web
  #   networks:
  #     - ember-network
  #   restart: unless-stopped

networks:
  ember-network:
    driver: bridge

volumes:
  postgres_data:
  api_logs:
  bot_logs:

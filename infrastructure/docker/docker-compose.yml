version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: ember-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ember
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database:/docker-entrypoint-initdb.d
    networks:
      - ember-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go API 服务
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: ember-api
    environment:
      - PORT=8080
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/ember?search_path=public
      - JWT_SECRET=${JWT_SECRET}
      - EMBY_URL=${EMBY_URL}
      - EMBY_API_KEY=${EMBY_API_KEY}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - BOT_NOTIFY_URL=http://bot:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ember-network
    restart: unless-stopped
    volumes:
      - ../../services/api/logs:/app/logs

  # Vue 前端服务（待实现）
  # web:
  #   build:
  #     context: ../../services/web
  #     dockerfile: Dockerfile
  #   container_name: ember-web
  #   ports:
  #     - "3000:3000"
  #   networks:
  #     - ember-network
  #   restart: unless-stopped

  # Python Telegram Bot
  bot:
    build:
      context: ../../services/bot
      dockerfile: Dockerfile
    container_name: ember-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - API_URL=http://api:8080
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - BOT_PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      - api
    networks:
      - ember-network
    restart: unless-stopped

  # Nginx 反向代理（可选）
  # nginx:
  #   image: nginx:alpine
  #   container_name: ember-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ../nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - api
  #     - web
  #   networks:
  #     - ember-network
  #   restart: unless-stopped

networks:
  ember-network:
    driver: bridge

volumes:
  postgres_data:

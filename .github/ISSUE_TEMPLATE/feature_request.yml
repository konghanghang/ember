name: 功能建议
description: 提议一个新功能或对现有功能的扩展
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提建议。**在继续之前**：
        - 请先搜索 [现有 issue](https://github.com/konghanghang/ember/issues?q=is%3Aissue) 与 [Discussions Ideas](https://github.com/konghanghang/ember/discussions/categories/ideas) 避免重复。
        - 还在想法阶段、不确定是否值得做的，建议先到 Discussions Ideas 讨论再来开 issue。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，没有重复（如仓库已启用 Discussions Ideas，也已搜索）
          required: true
        - label: 这是一个明确的、可被实现和验证的需求，不只是"如果有 X 就好了"
          required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及的功能场景
      description: 你希望增强 / 新增的能力属于哪个功能场景？按用户视角选择，不需要猜测代码层面的归属。
      options:
        - 注册 / 登录 / 邮箱验证码 / 找回密码
        - Emby 账号（开通、绑定、续期、过期、封禁）
        - 兑换码（注册兑换、续期兑换）
        - 付费 / Stripe 支付 / 套餐
        - 求片订阅 / 追剧日历
        - 播放排行榜 / 媒体统计
        - Telegram Bot（命令交互、通知推送、订阅审批）
        - 管理后台（用户管理、系统配置、审计日志）
        - 部署 / 升级 / Docker Compose
        - 文档错误
        - 不确定 / 其他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你在解决什么问题？
      description: 你在做什么时遇到了这个限制 / 不便？请描述具体场景，避免空泛的"如果有 X 就好了"。
      placeholder: 例如：我想批量给 50 个用户续期一个月，但目前控制台只能逐个操作，单次开通需要点 4 步……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望行为 / 方案
      description: 你希望系统提供什么能力？建议越具体越好（页面入口、字段、流程、命令）。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你尝试过 / 想过哪些 workaround？为什么它们不够好？

  - type: dropdown
    id: pr-intent
    attributes:
      label: 你愿意提 PR 实现吗？
      options:
        - 愿意，我可以提 PR
        - 愿意，但需要先讨论方案
        - 不打算，仅提建议
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 其他上下文
      description: 截图、参考其他项目的实现、相关 issue / 讨论链接等

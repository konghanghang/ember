name: Create Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v* 格式的 tag 时触发（如 v1.0.0）

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 获取完整历史

      - name: Extract version info
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Version: ${VERSION}"

          # 判断是否为预发布版本（包含 alpha, beta, rc 等）
          if [[ $VERSION =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "🚧 This is a pre-release version"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "✅ This is a stable release"
          fi

      - name: Resolve release notes
        id: notes
        run: |
          VERSION=${{ steps.version.outputs.version }}
          NOTES_FILE="docs/releases/${VERSION}.md"

          if [ ! -f "$NOTES_FILE" ]; then
            echo "Missing release notes file: ${NOTES_FILE}"
            echo "Create ${NOTES_FILE} before pushing the release tag."
            exit 1
          fi

          echo "file=${NOTES_FILE}" >> $GITHUB_OUTPUT
          echo "📝 Release notes: ${NOTES_FILE}"

      - name: Create Draft Release with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PRERELEASE=${{ steps.version.outputs.prerelease }}

          # 如果是预发布版本，添加 prerelease 标记
          if [ "$PRERELEASE" = "true" ]; then
            echo "🚧 Creating pre-release draft..."
            gh release create "${VERSION}" \
              --title "Ember ${VERSION}" \
              --notes-file "${{ steps.notes.outputs.file }}" \
              --draft \
              --prerelease
          else
            echo "📝 Creating draft release..."
            gh release create "${VERSION}" \
              --title "Ember ${VERSION}" \
              --notes-file "${{ steps.notes.outputs.file }}" \
              --draft
          fi

          echo "### 📝 Release 草稿创建成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本**: ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**类型**: $([ "$PRERELEASE" = "true" ] && echo "预发布版本" || echo "稳定版本")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**⚠️ 注意**: Release 已创建为草稿状态，请最后核对发布说明后再发布" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release 链接**: https://github.com/${{ github.repository }}/releases/tag/${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**下一步**:" >> $GITHUB_STEP_SUMMARY
          echo "1. 访问上面的链接" >> $GITHUB_STEP_SUMMARY
          echo "2. 核对 docs/releases/${VERSION}.md 的发布说明，尤其是升级说明" >> $GITHUB_STEP_SUMMARY
          echo "3. 点击 'Publish release' 发布" >> $GITHUB_STEP_SUMMARY

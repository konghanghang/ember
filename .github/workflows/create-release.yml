name: Create Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v* 格式的 tag 时触发（如 v1.0.0）

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史

      - name: Extract version info
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Version: ${VERSION}"

          # 判断是否为预发布版本（包含 alpha, beta, rc 等）
          if [[ $VERSION =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "🚧 This is a pre-release version"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "✅ This is a stable release"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Get previous tag
        id: previoustag
        run: |
          # 只在当前 HEAD 可达的 tag 里找上一个版本，避免历史重写后把旁支 tag
          # 误当作 release notes 基线。
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git tag --merged HEAD --sort=-v:refname | grep -vx "${CURRENT_TAG}" | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            echo "tag=" >> $GITHUB_OUTPUT
            echo "has_previous=false" >> $GITHUB_OUTPUT
            echo "📌 No previous reachable tag found on current history"
          else
            echo "tag=${PREV_TAG}" >> $GITHUB_OUTPUT
            echo "has_previous=true" >> $GITHUB_OUTPUT
            echo "📌 Previous reachable tag: ${PREV_TAG}"
          fi

      - name: Generate release notes
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PREV_TAG=${{ steps.previoustag.outputs.tag }}

          if [ -n "$PREV_TAG" ]; then
            python3 .github/scripts/generate_release_notes.py \
              --current-tag "$VERSION" \
              --previous-tag "$PREV_TAG" \
              --repo "${{ github.repository }}" \
              --output /tmp/release_notes.md
          else
            python3 .github/scripts/generate_release_notes.py \
              --current-tag "$VERSION" \
              --repo "${{ github.repository }}" \
              --output /tmp/release_notes.md
          fi

      - name: Create Draft Release with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PRERELEASE=${{ steps.version.outputs.prerelease }}

          # 如果是预发布版本，添加 prerelease 标记
          if [ "$PRERELEASE" = "true" ]; then
            echo "🚧 Creating pre-release draft..."
            gh release create "${VERSION}" \
              --title "Ember ${VERSION}" \
              --notes-file /tmp/release_notes.md \
              --draft \
              --prerelease
          else
            echo "📝 Creating draft release..."
            gh release create "${VERSION}" \
              --title "Ember ${VERSION}" \
              --notes-file /tmp/release_notes.md \
              --draft
          fi

          echo "### 📝 Release 草稿创建成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**版本**: ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**类型**: $([ "$PRERELEASE" = "true" ] && echo "预发布版本" || echo "稳定版本")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**⚠️ 注意**: Release 已创建为草稿状态，请重点核对自动生成的升级说明后再发布" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release 链接**: https://github.com/${{ github.repository }}/releases/tag/${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**下一步**:" >> $GITHUB_STEP_SUMMARY
          echo "1. 访问上面的链接" >> $GITHUB_STEP_SUMMARY
          echo "2. 核对自动生成的 Release Notes，尤其是升级说明" >> $GITHUB_STEP_SUMMARY
          echo "3. 点击 'Publish release' 发布" >> $GITHUB_STEP_SUMMARY

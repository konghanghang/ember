name: Build and Push Bot Image

on:
  push:
    branches:
      - pre_release  # 推送到 pre_release 分支时构建预览镜像
    tags:
      - 'v*'  # 推送 tag 时构建正式版本镜像

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/ember-bot

jobs:
  build-and-push:
    name: Build and Push Bot Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine image tags
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Tag 触发 - 构建正式版本（多架构）
            VERSION=${GITHUB_REF#refs/tags/}
            echo "tags=${{ env.GHCR_IMAGE }}:${VERSION},${{ env.GHCR_IMAGE }}:latest" >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "📦 Building release version: ${VERSION} (amd64 + arm64)"
          else
            # pre_release 分支触发 - 构建预览版本（仅 amd64，加快构建速度）
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "tags=${{ env.GHCR_IMAGE }}:preview,${{ env.GHCR_IMAGE }}:preview-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "version=preview-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "platforms=linux/amd64" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "🚧 Building preview version: preview-${SHORT_SHA} (amd64 only)"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Bot image
        uses: docker/build-push-action@v6
        with:
          context: ./services/bot
          file: ./services/bot/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          if [[ "${{ steps.meta.outputs.is_release }}" == "true" ]]; then
            echo "### 🎉 Bot 正式版镜像构建成功" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**版本**: ${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**镜像标签**:" >> $GITHUB_STEP_SUMMARY
            echo "- \`${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`${{ env.GHCR_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🚧 Bot 预览版镜像构建成功" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**版本**: ${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**镜像标签**:" >> $GITHUB_STEP_SUMMARY
            echo "- \`${{ env.GHCR_IMAGE }}:preview\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ **注意**: 这是预览版本，仅用于测试，不推荐生产使用" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**使用方式**:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

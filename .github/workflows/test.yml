name: Test

permissions:
  contents: write

on:
  push:
    branches:
      - master
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/badges/**'
  pull_request:
    branches:
      - master
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/badges/**'

jobs:
  test-api:
    name: Test Go API
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    defaults:
      run:
        working-directory: ./services/api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache-dependency-path: services/api/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with coverage
        run: |
          export GOCACHE=/tmp/ember-go-build
          go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Extract API coverage
        id: coverage
        run: |
          percent=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          echo "percent=$percent" >> "$GITHUB_OUTPUT"

      - name: Build
        run: go build -v ./...

      - name: ✅ API 测试通过
        run: echo "Go API 编译验证成功！"

  test-web:
    name: Test Vue Web
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    defaults:
      run:
        working-directory: ./services/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Extract Web coverage
        id: coverage
        run: |
          percent=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          echo "percent=$percent" >> "$GITHUB_OUTPUT"

      - name: ✅ Web 测试通过
        run: echo "Vue Web 编译验证成功！"

  test-bot:
    name: Test Python Bot
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    defaults:
      run:
        working-directory: ./services/bot

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/bot/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt coverage

      - name: Check syntax
        run: python -m py_compile main.py

      - name: Run tests with coverage
        run: python -m coverage run --source=app -m unittest discover -s tests -v

      - name: Extract Bot coverage
        id: coverage
        run: |
          percent=$(python -m coverage report --format=total)
          echo "percent=$percent" >> "$GITHUB_OUTPUT"

      - name: ✅ Bot 测试通过
        run: echo "Python Bot 单元测试与语法检查成功！"

  update-coverage-badges:
    name: Update Coverage Badges
    runs-on: ubuntu-latest
    needs:
      - test-api
      - test-web
      - test-bot
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write badge payloads
        env:
          API_COVERAGE: ${{ needs.test-api.outputs.coverage }}
          WEB_COVERAGE: ${{ needs.test-web.outputs.coverage }}
          BOT_COVERAGE: ${{ needs.test-bot.outputs.coverage }}
        run: python .github/scripts/write_coverage_badges.py

      - name: Commit badge updates
        run: |
          if git diff --quiet -- .github/badges; then
            echo "No coverage badge updates"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges
          git commit -m "docs(ci): 更新测试覆盖率徽章"
          git push

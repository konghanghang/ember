name: Test

on:
  push:
    branches:
      - master
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - master
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      bot: ${{ steps.filter.outputs.bot }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'scripts/test/api.sh'
              - 'scripts/test/lib.sh'
              - '.github/workflows/test.yml'
            web:
              - 'services/api/**'
              - 'services/web/**'
              - 'scripts/test/web.sh'
              - 'scripts/test/lib.sh'
              - '.github/workflows/test.yml'
            bot:
              - 'services/bot/**'
              - 'scripts/test/bot.sh'
              - 'scripts/test/lib.sh'
              - '.github/workflows/test.yml'

  test-api:
    name: Test Go API
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.13'
          cache-dependency-path: services/api/go.sum

      - name: Download dependencies
        working-directory: ./services/api
        run: go mod download

      - name: Prepare integration database
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h 127.0.0.1 -U postgres -d postgres; do
            sleep 1
          done
          psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE ember_integration;'

      - name: Run API test report suite
        env:
          EMBER_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ember_integration?sslmode=disable
        run: bash scripts/test/api.sh

      - name: Extract API coverage
        id: coverage
        if: always()
        run: |
          percent="$(cat artifacts/test-results/api/coverage-summary.txt 2>/dev/null || true)"
          if [[ -z "${percent}" ]]; then
            percent="N/A"
          fi
          echo "percent=${percent}" >> "$GITHUB_OUTPUT"

      - name: Upload API test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-api
          path: artifacts/test-results/api
          if-no-files-found: error

  test-web:
    name: Test Vue Web
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.13'
          cache-dependency-path: services/api/go.sum

      - name: Install dependencies
        working-directory: ./services/web
        run: npm ci

      - name: Download API dependencies for web integration flow
        working-directory: ./services/api
        run: go mod download

      - name: Prepare integration database
        env:
          PGPASSWORD: postgres
        run: |
          until pg_isready -h 127.0.0.1 -U postgres -d postgres; do
            sleep 1
          done
          psql -h 127.0.0.1 -U postgres -d postgres -c 'CREATE DATABASE ember_integration;'

      - name: Run Web test report suite
        env:
          EMBER_INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ember_integration?sslmode=disable
        run: bash scripts/test/web.sh

      - name: Extract Web coverage
        id: coverage
        if: always()
        run: |
          percent="$(cat artifacts/test-results/web/coverage-summary.txt 2>/dev/null || true)"
          if [[ -z "${percent}" ]]; then
            percent="N/A"
          fi
          echo "percent=${percent}" >> "$GITHUB_OUTPUT"

      - name: Upload Web test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-web
          path: artifacts/test-results/web
          if-no-files-found: error

  test-bot:
    name: Test Python Bot
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            services/bot/requirements.txt
            services/bot/requirements-dev.txt

      - name: Create bot virtualenv
        working-directory: ./services/bot
        run: python -m venv .venv

      - name: Install bot dev dependencies
        working-directory: ./services/bot
        run: .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run Bot test report suite
        run: bash scripts/test/bot.sh

      - name: Extract Bot coverage
        id: coverage
        if: always()
        run: |
          percent="$(cat artifacts/test-results/bot/coverage-summary.txt 2>/dev/null || true)"
          if [[ -z "${percent}" ]]; then
            percent="N/A"
          fi
          echo "percent=${percent}" >> "$GITHUB_OUTPUT"

      - name: Upload Bot test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-bot
          path: artifacts/test-results/bot
          if-no-files-found: error

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs:
      - test-api
      - test-web
      - test-bot
    if: always()

    steps:
      - name: Publish test summary
        env:
          API_COVERAGE: ${{ needs.test-api.outputs.coverage }}
          WEB_COVERAGE: ${{ needs.test-web.outputs.coverage }}
          BOT_COVERAGE: ${{ needs.test-bot.outputs.coverage }}
        run: |
          api="${API_COVERAGE:-N/A}"
          web="${WEB_COVERAGE:-N/A}"
          bot="${BOT_COVERAGE:-N/A}"

          if [[ "${api}" != "N/A" ]]; then
            api="${api}%"
          fi
          if [[ "${web}" != "N/A" ]]; then
            web="${web}%"
          fi
          if [[ "${bot}" != "N/A" ]]; then
            bot="${bot}%"
          fi

          {
            echo "## Coverage Summary"
            echo ""
            echo "| Module | Coverage | Artifact |"
            echo "| --- | --- | --- |"
            echo "| API | ${api} | \`test-results-api\` |"
            echo "| Web | ${web} | \`test-results-web\` |"
            echo "| Bot | ${bot} | \`test-results-bot\` |"
            echo ""
            echo "Coverage 仅统计基础单测套件；集成测试仍通过 artifact 单独留痕。"
            echo "每个 artifact 均包含日志、JSON/JUnit 报告、suite meta.json 和覆盖率产物。"
          } >> "$GITHUB_STEP_SUMMARY"
